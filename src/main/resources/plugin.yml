name: MinecraftServerCore
version: '${version}'
main: dev.thedusk.minecraftserver.MinecraftServerCore
description: Core runtime for the AI-native Minecraft server project.
author: thedusk4203
api-version: '26.3'
depend: [GriefPrevention, AuraSkills]

commands:
  mcserver:
    description: Administrative health and diagnostics command.
    usage: /mcserver <health|diagnostics>
    permission: minecraftserver.admin
  market:
    description: Durable player market escrow commands.
    usage: /market <sell|list|cancel|recover>
    permission: minecraftserver.market
  boss:
    description: Start, inspect or recover the Stone Warden encounter and rewards.
    usage: /boss <start [player...]|status|recover>
    permission: minecraftserver.boss

permissions:
  minecraftserver.admin:
    description: Allows access to MinecraftServerCore administrative commands.
    default: op
  minecraftserver.market:
    description: Allows players to use the server market.
    default: true
  minecraftserver.boss:
    description: Allows players to start, inspect and recover the first PvE boss encounter.
    default: true
