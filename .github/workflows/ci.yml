name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORWARDING_SECRET: ci-forwarding-secret-ephemeral-only
      POSTGRES_PASSWORD: ci-postgres-password-ephemeral-only
      RCON_PASSWORD: ci-rcon-password-ephemeral-only

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.8.2'

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build core plugin and unit tests
        run: gradle clean build --no-daemon

      - name: Verify shaded runtime resources
        run: |
          plugin_jar="$(find build/libs -maxdepth 1 -type f -name 'minecraft-server-core-*.jar' -print -quit)"
          test -n "$plugin_jar"
          echo "Checking runtime resources in $plugin_jar"
          jar tf "$plugin_jar" | grep -qx 'db/migration/V1__core_platform.sql'
          jar tf "$plugin_jar" | grep -qx 'db/migration/V6__encounter_runtime.sql'
          jar tf "$plugin_jar" | grep -qx 'encounters/index.txt'
          jar tf "$plugin_jar" | grep -qx 'encounters/framework_probe.properties'
          jar tf "$plugin_jar" | grep -qx 'encounters/stone_warden.properties'

      - name: Run PostgreSQL integration tests
        run: gradle integrationTest --no-daemon

      - name: Start local stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check PostgreSQL
        run: docker compose exec -T postgres pg_isready -U minecraft -d minecraft

      - name: Check Paper core plugin and database
        run: |
          health="$(docker compose exec -T paper rcon-cli 'mcserver health')"
          echo "$health"
          echo "$health" | grep -q 'db=UP'

      - name: Check encounter runtime foundation
        run: |
          table_exists="$(docker compose exec -T postgres psql -U minecraft -d minecraft -tAc "SELECT to_regclass('public.encounter_run') IS NOT NULL")"
          echo "encounter_run table exists: $table_exists"
          echo "$table_exists" | grep -qx 't'
          docker compose logs paper | grep -q 'validated encounter definition(s)'

      - name: Check Stone Warden runtime wiring
        run: |
          boss="$(docker compose exec -T paper rcon-cli 'boss status')"
          echo "$boss"
          echo "$boss" | grep -q 'No active Stone Warden encounter.'
          docker compose logs paper | grep -q 'Stone Warden combat runtime=READY'

      - name: Check gameplay dependencies
        run: |
          plugins="$(docker compose exec -T paper rcon-cli 'plugins')"
          echo "$plugins"
          echo "$plugins" | grep -qi 'GriefPrevention'
          echo "$plugins" | grep -qi 'AuraSkills'

      - name: Check market command wiring
        run: |
          market="$(docker compose exec -T paper rcon-cli 'market list')"
          echo "$market"
          echo "$market" | grep -qi 'requires an online player'

      - name: Check crossplay proxy plugins
        run: |
          docker compose exec -T velocity sh -ec '
            test -f plugins/Geyser-Velocity/config.yml
            test -f plugins/floodgate/config.yml
          '

      - name: Show stack status
        if: always()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Stop local stack
        if: always()
        run: docker compose down -v
